databases:
  - name: sentinel-preview-db
    plan: free
    databaseName: sentinel_preview
    user: sentinel
    postgresMajorVersion: "16"

services:
  - type: web
    name: sentinel-preview
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run start -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-preview-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false
      - key: ALLOWED_GITHUB_USERS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
